<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)"/>

  <!-- 三层 L 字堆叠 -->
  <!-- 底层 L - 最大，最透明 -->
  <g fill="#ffffff" opacity="0.25">
    <rect x="24" y="24" width="14" height="80" rx="3"/>
    <rect x="24" y="90" width="80" height="14" rx="3"/>
  </g>

  <!-- 中层 L - 中等大小 -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="32" y="34" width="12" height="64" rx="3"/>
    <rect x="32" y="86" width="64" height="12" rx="3"/>
  </g>

  <!-- 顶层 L - 最小，最清晰 -->
  <g fill="#ffffff">
    <rect x="40" y="44" width="10" height="50" rx="2"/>
    <rect x="40" y="84" width="48" height="10" rx="2"/>
  </g>
</svg>
